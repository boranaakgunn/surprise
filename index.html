<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>🔒</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    color:#fbf0dd;font:17px/1.6 Georgia,'Times New Roman',serif;text-align:center;
    background:radial-gradient(900px 600px at 50% 0%,rgba(255,168,92,.30),transparent 62%),
      radial-gradient(600px 460px at 95% 100%,rgba(214,90,100,.22),transparent 62%),
      linear-gradient(170deg,#2c1610,#150a0a 72%);
  }
  main{max-width:380px;width:100%}
  .lock{font-size:46px;margin-bottom:14px;animation:float 3.5s ease-in-out infinite}
  h1{font-size:1.5rem;font-weight:normal;margin-bottom:8px}
  p.sub{color:#e6cdb8;margin-bottom:22px}
  form{display:flex;gap:8px}
  input{
    flex:1;min-width:0;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.07);color:#fff;font:inherit;outline:none;
  }
  input:focus{border-color:#f3c98b}
  button{
    padding:14px 20px;border:0;border-radius:14px;background:linear-gradient(135deg,#f3c98b,#e79aa6);color:#2a1210;
    font:inherit;font-weight:bold;cursor:pointer;
  }
  button:disabled{opacity:.6;cursor:default}
  #msg{min-height:1.6em;margin-top:16px;color:#f0cf9b;font-size:.95rem}
  .shake{animation:shake .4s}
  @keyframes float{50%{transform:translateY(-6px)}}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  @media (prefers-reduced-motion:reduce){.lock,.shake{animation:none}}
</style>
</head>
<body>
<main>
  <div class="lock">🔒</div>
  <h1>Bu sayfa sadece sana özel</h1>
  <p class="sub">Notta yazan şifreyi gir 🌷</p>
  <form id="f">
    <input id="pw" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="şifre" aria-label="şifre">
    <button id="go" type="submit">Aç</button>
  </form>
  <p id="msg" role="alert"></p>
</main>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
// Yazım farklarını (büyük/küçük harf, boşluk) tolere etmek için şifre normalize edilir.
const norm = s => s.normalize('NFC').trim().toLowerCase();

async function unlock(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(pw)), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.data));
  return new TextDecoder().decode(buf);
}

function show(html){
  document.open();
  document.write(html);
  document.close();
}

const form = document.getElementById('f');
const input = document.getElementById('pw');
const btn = document.getElementById('go');
const msg = document.getElementById('msg');

async function attempt(pw, silent){
  btn.disabled = true;
  if(!silent) msg.textContent = '';
  try{
    const html = await unlock(pw);
    try{ sessionStorage.setItem('k', pw); }catch(e){}
    show(html);
  }catch(e){
    btn.disabled = false;
    if(!silent){
      msg.textContent = 'Olmadı gibi… notu bir daha oku 🌷';
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
    }
    try{ sessionStorage.removeItem('k'); }catch(e2){}
  }
}

form.addEventListener('submit', e => {
  e.preventDefault();
  if(input.value.trim()) attempt(input.value, false);
});

// Aynı oturumda sayfa yenilenirse tekrar sorma
try{
  const saved = sessionStorage.getItem('k');
  if(saved) attempt(saved, true);
}catch(e){}
